{% extends "admin/base.html" %}
{% load static %}

{% block extrahead %}
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'admin/base.css' %}">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YLWGR2PZPR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-YLWGR2PZPR');
</script>
{% endblock %}

{% block branding %}
<h1 id="site-name">
    <i class="bi bi-mortarboard-fill"></i> Kimün - Administración
</h1>
{% endblock %}

{% block userlinks %}
<div class="user-tools">
    {% if user.has_usable_password %}
    <a href="{% url 'admin:password_change' %}">
        <i class="bi bi-key"></i> Cambiar contraseña
    </a>
    {% endif %}
    <a href="{% url 'admin:logout' %}">
        <i class="bi bi-box-arrow-right"></i> Cerrar sesión
    </a>
</div>
{% endblock %}
